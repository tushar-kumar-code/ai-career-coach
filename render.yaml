services:
  # Backend API Service (FastAPI)
  - type: web
    name: ai-career-coach-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PROJECT_NAME
        value: AI Career Coach API
      - key: API_V1_STR
        value: /api/v1
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        value: ai_career_coach_stable_production_jwt_secret_key_2026_xyz
      - key: FIREBASE_PROJECT_ID
        value: ai-career-coach-da37b
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./aicareercoach.db

  # Frontend Web Service (Next.js)
  - type: web
    name: ai-career-coach-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-career-coach-backend-qkha.onrender.com/api/v1
